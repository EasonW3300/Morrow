[package]
name = "morrow-desktop"
version = "0.1.0"
description = "Morrow 桌面壳（Tauri 2）：拉起 Runtime sidecar，Chat 视图经控制面 HTTP/SSE 通信"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
