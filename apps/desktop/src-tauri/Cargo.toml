[package]
name = "morrow-desktop"
version = "0.1.0"
description = "Morrow 桌面壳（Tauri 2）：拉起 Runtime sidecar，Chat 视图经控制面 HTTP/SSE 通信"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 系统通知（Issue #47 / PRD §4.8 FR-NOT-2）：Tauri v2 官方插件，权限态由 OS 管理
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 信号转发（sidecar.rs）为 unix 专属；Windows 无 SIGTERM 语义（见模块注释已知限制）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
